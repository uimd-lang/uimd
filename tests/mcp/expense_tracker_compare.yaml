- name: expense_tracker
  app: python/examples/expense_tracker/expense_tracker.py
  tests:
    - tool: get_window
      assert:
        title: Expense Tracker
    - tool: get_element
      arguments:
        element_id: main.item_input
      assert:
        value: ""
    - tool: set_text
      arguments:
        element_id: main.item_input
        text: Coffee
      assert:
        value: Coffee
    - tool: mouse_click
      compare_snapshot: false
      arguments:
        x: 41
        y: 6
    - tool: get_edit_mode
      compare_snapshot: false
      assert:
        edit_mode: true
    - tool: get_focused_element
      compare_snapshot: false
      assert:
        id: main.amount_input
    - tool: press_key
      compare_snapshot: false
      arguments:
        key: "7"
    - tool: press_key
      arguments:
        key: Enter
    - tool: get_edit_mode
      assert:
        edit_mode: false
    - tool: get_element
      arguments:
        element_id: main.amount_input
      assert:
        value: 7.0
    - tool: set_text
      arguments:
        element_id: main.amount_input
        text: 3.5
      assert:
        value: 3.5
    - tool: ui.select_option
      arguments:
        element_id: main.category_input
        value: Food
      assert:
        value: Food
    - tool: activate_element
      arguments:
        element_id: main.add_expense_btn
    - tool: get_element
      arguments:
        element_id: main.expenses[0].item
      assert:
        value: Coffee
    - tool: mouse_click
      arguments:
        x: 35
        y: 14
    - tool: get_element
      arguments:
        element_id: main.expenses[0].paid
      assert:
        value: true
    - tool: focus_element
      arguments:
        element_id: main.expenses
      assert:
        id: main.expenses
    - tool: press_key
      arguments:
        key: Enter
    - tool: get_focused_element
      assert:
        id: main.expenses[0].paid
    - tool: press_key
      arguments:
        key: Down
    - tool: get_focused_element
      assert:
        id: main.expenses[0].category
    - tool: press_key
      arguments:
        key: Up
    - tool: get_focused_element
      assert:
        id: main.expenses[0].paid
    - tool: press_key
      arguments:
        key: Right
    - tool: get_focused_element
