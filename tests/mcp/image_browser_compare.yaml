- name: image_browser
  app: python/examples/image_browser/image_browser.py
  env:
    UIMD_DETERMINISTIC_IMAGE_FALLBACK: "1"
  tests:
    - tool: get_window
      assert:
        title: Image Browser
    - tool: get_element
      arguments:
        element_id: camera_thumb
      assert:
        focused: true
    - tool: get_element
      arguments:
        element_id: mode_select
      assert:
        value: Normal
    - tool: get_render_snapshot
    - tool: activate_element
      arguments:
        element_id: astro_thumb
    - tool: get_element
      arguments:
        element_id: main.caption
      assert:
        value: Astronaut
    - tool: get_render_snapshot
    - tool: activate_element
      arguments:
        element_id: coffee_thumb
    - tool: get_element
      arguments:
        element_id: main.caption
      assert:
        value: Coffee
    - tool: get_image_render_info
      arguments:
        element_id: main.photo
      compare_fields:
        - source
        - fit
        - configured_render_mode
        - resolved_render_mode
        - source_loaded
        - source_width
        - source_height
        - element_width
        - element_height
        - image_left
        - image_top
        - image_width
        - image_height
        - visible_left
        - visible_top
        - visible_width
        - visible_height
        - raw_expected
        - raw_present
      assert:
        source_loaded: true
        fit: contain
        configured_render_mode: sixel
        resolved_render_mode: deterministic
        raw_expected: false
        raw_present: false
    - tool: get_render_snapshot
    - tool: activate_element
      arguments:
        element_id: image_list_btn
    - tool: get_element
