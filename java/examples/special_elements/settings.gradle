rootProject.name = "special_elements"

def installedRuntime = System.getenv("UIMD_SDK_JAVA_TARGET")
def localRuntime = file("../..")
def runtimeRoot = installedRuntime ? file(installedRuntime) : localRuntime
if (!new File(runtimeRoot, "settings.gradle").isFile())
{
    throw new GradleException("UIMD Java runtime was not found. Set UIMD_SDK_JAVA_TARGET or keep the source runtime available.")
}
gradle.ext.uimdRuntimeRoot = runtimeRoot.canonicalFile
includeBuild(runtimeRoot)
