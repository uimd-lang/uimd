[package]
name = "uimd"
version = "0.5.6"
edition = "2024"
license = "MIT"
description = "Rust terminal runtime for User Interface Markdown"

[lib]
name = "uimd"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
